<title>Doces Monnyque — Painel Administrativo</title>

<style>
:root {
  --cream: #fff8f2;
  --cream-soft: #fbead9;
  --surface: #ffffff;
  --surface-alt: #fff1e6;
  --brown: #3e2723;
  --brown-soft: #8b6459;
  --border: #f0dcc7;
  --rose: #d9738f;
  --rose-dark: #b54f6e;
  --rose-soft: #fbe1e8;
  --gold: #c08a45;
  --gold-soft: #f3e3c8;
  --shadow: rgba(62, 39, 35, 0.14);
  --success: #4c9a5b;
  --danger: #c24444;
  --info: #3d7dc9;
}

* {
  box-sizing: border-box;
}
html,
body,
#root {
  height: 100%;
}
body {
  margin: 0;
  background: var(--cream);
  color: var(--brown);
  font-family: "Manrope", -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1,
h2,
h3,
h4 {
  font-family: "Fraunces", Georgia, serif;
  margin: 0;
  text-wrap: balance;
}
p {
  margin: 0;
}
button {
  font-family: inherit;
}
a {
  color: inherit;
}
img {
  max-width: 100%;
}
svg {
  display: block;
}
/* ===================== PAINEL ADMINISTRATIVO ===================== */
.admin-app {
  --a-bg: #f7f7f8;
  --a-surface: #ffffff;
  --a-border: #e6e5e3;
  --a-text: #211d1a;
  --a-text-soft: #75726d;
  --a-accent: #b54f6e;
  --a-accent-soft: #fbe1e8;
  --a-sidebar: #1d1815;
  --a-sidebar-text: #d8cfc8;
  background: var(--a-bg);
  color: var(--a-text);
  min-height: 100vh;
  font-family: "Manrope", sans-serif;
}
.admin-app h1,
.admin-app h2,
.admin-app h3 {
  font-family: "Manrope", sans-serif;
}
.admin-app * {
  box-sizing: border-box;
}

/* Login */
.admin-login {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: linear-gradient(160deg, #201a16, #33241f);
  padding: 20px;
}
.admin-login[hidden] {
  display: none;
}
.admin-login .box {
  width: 100%;
  max-width: 380px;
  background: var(--a-surface);
  border-radius: 20px;
  padding: 32px 28px;
  box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.5);
}
.admin-login .brand {
  font-family: "Fraunces", serif;
  font-size: 1.5rem;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--a-text);
}
.admin-login .brand em {
  font-style: italic;
  color: var(--a-accent);
}
.admin-login .sub {
  color: var(--a-text-soft);
  font-size: 0.86rem;
  margin-bottom: 24px;
}

/* Layout with sidebar */
.admin-shell {
  display: flex;
  min-height: 100vh;
}
.admin-shell[hidden] {
  display: none;
}
.admin-sidebar {
  width: 240px;
  flex: 0 0 auto;
  background: var(--a-sidebar);
  color: var(--a-sidebar-text);
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.admin-sidebar .brand {
  font-family: "Fraunces", serif;
  font-size: 1.25rem;
  font-weight: 600;
  color: #fff;
  padding: 6px 10px 22px;
}
.admin-sidebar .brand em {
  font-style: italic;
  color: #e79db2;
}
.admin-nav {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
}
.admin-nav a {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 12px;
  border-radius: 10px;
  text-decoration: none;
  color: var(--a-sidebar-text);
  font-size: 0.88rem;
  font-weight: 600;
}
.admin-nav a svg {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
}
.admin-nav a:hover {
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
}
.admin-nav a.active {
  background: var(--a-accent);
  color: #fff;
}
.admin-sidebar .logout-btn {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 12px;
  border-radius: 10px;
  background: none;
  border: none;
  color: var(--a-sidebar-text);
  font-weight: 600;
  font-size: 0.88rem;
  cursor: pointer;
  width: 100%;
  text-align: left;
}
.admin-sidebar .logout-btn svg {
  width: 18px;
  height: 18px;
}
.admin-sidebar .logout-btn:hover {
  color: #fff;
}

.admin-topbar {
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--a-sidebar);
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 40;
}
.admin-topbar button {
  background: none;
  border: none;
  color: #fff;
  cursor: pointer;
}
.admin-topbar button svg {
  width: 24px;
  height: 24px;
}

.admin-main {
  flex: 1;
  min-width: 0;
  padding: 28px 30px 60px;
}
.admin-page-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.admin-page-head h1 {
  font-size: 1.5rem;
  font-weight: 700;
}
.admin-page-head p {
  color: var(--a-text-soft);
  font-size: 0.86rem;
  margin-top: 3px;
}

/* Buttons */
.admin-app .btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 10px 16px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 0.85rem;
  border: 1px solid transparent;
  cursor: pointer;
  text-decoration: none;
}
.admin-app .btn svg {
  width: 15px;
  height: 15px;
}
.admin-app .btn-primary {
  background: var(--a-accent);
  color: #fff;
}
.admin-app .btn-primary:hover {
  background: #9d4160;
}
.admin-app .btn-outline {
  background: #fff;
  border-color: var(--a-border);
  color: var(--a-text);
}
.admin-app .btn-outline:hover {
  background: #f2f1ef;
}
.admin-app .btn-danger {
  background: #fff;
  border-color: #f0d0d0;
  color: #b23a3a;
}
.admin-app .btn-danger:hover {
  background: #fdf0f0;
}
.admin-app .btn-sm {
  padding: 7px 12px;
  font-size: 0.78rem;
}
.admin-app .btn[disabled] {
  opacity: 0.55;
  pointer-events: none;
}
.admin-app .icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--a-border);
  background: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.admin-app .icon-btn svg {
  width: 15px;
  height: 15px;
}
.admin-app .icon-btn:hover {
  background: #f2f1ef;
}

/* Stat cards */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 16px;
  margin-bottom: 30px;
}
.stat-card {
  background: var(--a-surface);
  border: 1px solid var(--a-border);
  border-radius: 16px;
  padding: 18px 20px;
}
.stat-card .label {
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--a-text-soft);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat-card .value {
  font-size: 1.7rem;
  font-weight: 800;
  margin-top: 8px;
  font-variant-numeric: tabular-nums;
}
.stat-card.accent .value {
  color: var(--a-accent);
}

/* Cards / panels */
.admin-app .panel {
  background: var(--a-surface);
  border: 1px solid var(--a-border);
  border-radius: 16px;
  padding: 20px;
}
.admin-app .panel + .panel {
  margin-top: 18px;
}
.admin-app .panel h3 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 14px;
}

/* Table */
.admin-table-wrap {
  overflow-x: auto;
  background: var(--a-surface);
  border: 1px solid var(--a-border);
  border-radius: 16px;
}
table.admin-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.86rem;
  min-width: 640px;
}
table.admin-table th {
  text-align: left;
  padding: 12px 16px;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--a-text-soft);
  border-bottom: 1px solid var(--a-border);
  white-space: nowrap;
}
table.admin-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--a-border);
  vertical-align: middle;
}
table.admin-table tr:last-child td {
  border-bottom: none;
}
.admin-app .row-thumb {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--a-bg);
  display: grid;
  place-items: center;
  overflow: hidden;
}
.admin-app .row-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.admin-app .row-thumb svg {
  width: 60%;
  height: 60%;
}
.admin-app .row-actions {
  display: flex;
  gap: 6px;
}

/* Badges */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.74rem;
  font-weight: 700;
  white-space: nowrap;
}
.pill-active {
  background: #e5f3e8;
  color: #2e7d4f;
}
.pill-inactive {
  background: #f1f0ee;
  color: var(--a-text-soft);
}

/* Tabs */
.admin-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  overflow-x: auto;
}
.admin-tab {
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--a-border);
  background: #fff;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  color: var(--a-text-soft);
}
.admin-tab.active {
  background: var(--a-text);
  border-color: var(--a-text);
  color: #fff;
}

/* Forms */
.admin-app .field {
  margin-bottom: 14px;
}
.admin-app .field label {
  display: block;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--a-text-soft);
  margin-bottom: 6px;
}
.admin-app .field input,
.admin-app .field textarea,
.admin-app .field select {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--a-border);
  background: #fff;
  color: var(--a-text);
  font-family: inherit;
  font-size: 0.88rem;
}
.admin-app .field input:focus,
.admin-app .field textarea:focus,
.admin-app .field select:focus {
  outline: 2px solid var(--a-accent);
  outline-offset: 1px;
}
.admin-app .field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.admin-app .check-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.86rem;
  font-weight: 600;
  margin-bottom: 12px;
}
.admin-app .check-row input {
  width: 16px;
  height: 16px;
}

/* Modal */
.admin-app .modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 16, 14, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
}
.admin-app .modal-overlay[hidden] {
  display: none;
}
.admin-app .modal-box {
  background: #fff;
  border-radius: 18px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
}
.admin-app .modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.admin-app .modal-head h3 {
  font-size: 1.1rem;
  font-weight: 700;
}

.admin-app .empty-state {
  text-align: center;
  padding: 46px 20px;
  color: var(--a-text-soft);
}
.admin-app .empty-state svg {
  width: 40px;
  height: 40px;
  opacity: 0.5;
  margin: 0 auto 10px;
}

.admin-app .image-drop {
  border: 1.5px dashed var(--a-border);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.admin-app .image-drop .prev {
  width: 56px;
  height: 56px;
  border-radius: 10px;
  overflow: hidden;
  background: var(--a-bg);
  display: grid;
  place-items: center;
  flex: 0 0 auto;
}
.admin-app .image-drop .prev img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.admin-app .image-drop .prev svg {
  width: 60%;
  height: 60%;
  color: var(--a-text-soft);
}

.admin-app .order-detail dl {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 8px 12px;
  font-size: 0.86rem;
  margin: 0;
}
.admin-app .order-detail dt {
  color: var(--a-text-soft);
  font-weight: 600;
}
.admin-app .order-detail dd {
  margin: 0;
}
.admin-app .order-items-list {
  margin-top: 14px;
  border-top: 1px solid var(--a-border);
  padding-top: 12px;
}
.admin-app .order-items-list .li {
  display: flex;
  justify-content: space-between;
  font-size: 0.86rem;
  padding-block: 4px;
}
.admin-app .status-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.chip-input {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px;
  border: 1px solid var(--a-border);
  border-radius: 10px;
  background: #fff;
}
.chip-input .chip {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--a-bg);
  border-radius: 999px;
  padding: 4px 8px 4px 10px;
  font-size: 0.78rem;
  font-weight: 600;
}
.chip-input .chip button {
  border: none;
  background: none;
  cursor: pointer;
  color: var(--a-text-soft);
  display: flex;
}
.chip-input .chip button svg {
  width: 12px;
  height: 12px;
}
.chip-input input {
  border: none;
  outline: none;
  flex: 1;
  min-width: 100px;
  font-size: 0.86rem;
  padding: 4px;
}

.hours-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
  margin-bottom: 8px;
  align-items: center;
}

@media (max-width: 900px) {
  .admin-sidebar {
    display: none;
  }
  .admin-topbar {
    display: flex;
  }
  .admin-main {
    padding: 20px 16px 50px;
  }
  .admin-shell.nav-open .admin-sidebar {
    display: flex;
    position: fixed;
    z-index: 90;
    inset: 0 auto 0 0;
  }
  .admin-shell.nav-open::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 80;
  }
  .admin-app .field-row {
    grid-template-columns: 1fr;
  }
}

</style>
</head>

// Redimensiona/comprime a foto no próprio celular antes de subir pro Storage,
// pra não travar o upload nem deixar o cardápio lento carregando fotos gigantes
// (foto de câmera de celular pode vir com 4000px/8MB; aqui reduzimos pra no
// máximo 1280px no lado maior e convertemos pra JPEG comprimido).
async function resizeImageFile(file, maxDim = 1280, quality = 0.82) {
  if (!file.type.startsWith("image/")) return file;
  try {
    const bitmap = await createImageBitmap(file);
    let { width, height } = bitmap;
    if (width <= maxDim && height <= maxDim && file.size <= 600 * 1024) {
      bitmap.close?.();
      return file; // já é pequena, não precisa mexer
    }
    const scale = Math.min(1, maxDim / Math.max(width, height));
    width = Math.round(width * scale);
    height = Math.round(height * scale);
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    canvas.getContext("2d").drawImage(bitmap, 0, 0, width, height);
    bitmap.close?.();
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
    if (!blob) return file;
    const newName = file.name.replace(/\.[^.]+$/, "") + ".jpg";
    return new File([blob], newName, { type: "image/jpeg" });
  } catch {
    return file; // se der qualquer problema, envia a foto original mesmo
  }
}

async function nextOrderNumber() {
  const counterRef = doc(db, "settings", "counters");
  return runTransaction(db, async (tx) => {
    const snap = await tx.get(counterRef);
    const current = snap.exists() ? snap.data().nextOrderNumber || 1 : 1;
    tx.set(counterRef, { nextOrderNumber: current + 1 }, { merge: true });
    return current;
  });
}

        ${order.orderType === "entrega" ? `<dt>Endereço</dt><dd>${order.address || "—"}</dd>` : ""}
        <dt>Pagamento</dt><dd>${order.paymentMethod || "—"}</dd>
        ${order.notes ? `<dt>Observação</dt><dd>${order.notes}</dd>` : ""}
        <dt>Recebido em</dt><dd>${fmtDate(order.createdAt)}</dd>
      </dl>
      <div class="order-items-list">${itemsHTML}</div>
      <div class="status-actions" id="statusActions"></div>
      <a href="https://wa.me/${(order.phone || "").replace(/\D/g, "")}?text=${wppMsg}" target="_blank" rel="noopener" class="btn btn-outline btn-sm" style="margin-top:14px;"><svg><use href="#ic-whatsapp"/></svg> Abrir conversa no WhatsApp</a>
    </div>`);

  const actionsEl = $("#statusActions");
  actionsEl.innerHTML = STATUS_FLOW.map((st) => `<button class="btn btn-sm ${order.status === st ? "btn-primary" : "btn-outline"}" data-set-status="${st}">${STATUS[st].emoji} ${STATUS[st].label}</button>`).join("") +
    `<button class="btn btn-sm btn-danger" data-set-status="cancelado">🔴 Cancelar</button>`;
  actionsEl.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-set-status]");
    if (!btn) return;
    await updateDoc(doc(db, "orders", orderId), { status: btn.dataset.setStatus });
    closeModal();
    openOrderDetail(orderId);
  });
}

function openNewOrderModal() {
  const activeProducts = products.filter((p) => p.active !== false);
  showModal(`
    <div class="modal-head"><h3>Novo pedido</h3><button class="icon-btn" data-close-modal aria-label="Fechar"><svg><use href="#ic-close"/></svg></button></div>
    <form id="newOrderForm">
      <div class="field-row">
        <div class="field"><label>Nome do cliente</label><input id="noName" required/></div>
        <div class="field"><label>Telefone</label><input id="noPhone" required/></div>
      </div>
      <div class="field">
        <label>Produtos</label>
        <div id="noLines"></div>
        <button type="button" class="btn btn-outline btn-sm" id="noAddLine"><svg><use href="#ic-plus"/></svg> Adicionar produto</button>
      </div>
      <div class="field">
        <label>Retirada ou entrega</label>
        <div style="display:flex;gap:8px;">
          <button type="button" class="btn btn-sm btn-primary" data-no-type="retirada"><svg><use href="#ic-store"/></svg> Retirada</button>
          <button type="button" class="btn btn-sm btn-outline" data-no-type="entrega"><svg><use href="#ic-bike"/></svg> Entrega</button>
        </div>
      </div>
      <div class="field" id="noAddressField" hidden><label>Endereço</label><textarea id="noAddress" rows="2"></textarea></div>
      <div class="field"><label>Forma de pagamento</label><select id="noPayment">${(settings.paymentMethods || []).map((m) => `<option value="${m}">${m}</option>`).join("")}</select></div>
      <div class="field"><label>Observação</label><textarea id="noNotes" rows="2"></textarea></div>
      <div style="display:flex;justify-content:space-between;font-size:.86rem;margin-top:12px;"><span>Total</span><strong id="noTotal">${money(0)}</strong></div>
      <p id="noError" style="color:#b23a3a;font-size:.82rem;margin-top:8px;display:none;"></p>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:16px;" type="submit" id="noSubmit">Salvar pedido</button>
    </form>`);

  let noType = "retirada";
  let lines = [{ productId: "", qty: 1 }];

  function renderLines() {
    $("#noLines").innerHTML = lines.map((l, idx) => `
      <div style="display:flex;gap:8px;margin-bottom:8px;" data-line="${idx}">
        <select style="flex:1;" data-line-product="${idx}">
          <option value="">Selecione um produto…</option>
          ${activeProducts.map((p) => `<option value="${p.id}" ${l.productId === p.id ? "selected" : ""}>${p.name} — ${money(p.price)}</option>`).join("")}
        </select>
        <input type="number" min="1" value="${l.qty}" style="width:70px;" data-line-qty="${idx}"/>
        <button type="button" class="icon-btn" data-line-remove="${idx}" aria-label="Remover"><svg><use href="#ic-trash"/></svg></button>
      </div>`).join("");
    updateTotal();
  }
  function updateTotal() {
    const total = lines.reduce((s, l) => {
      const p = activeProducts.find((x) => x.id === l.productId);
      return p ? s + p.price * Number(l.qty || 0) : s;
    }, 0) + (noType === "entrega" ? Number(settings.deliveryFee) || 0 : 0);
    $("#noTotal").textContent = money(total);
  }
  renderLines();

  $("#noAddLine").addEventListener("click", () => { lines.push({ productId: "", qty: 1 }); renderLines(); });
  $("#noLines").addEventListener("change", (e) => {
    const pIdx = e.target.getAttribute("data-line-product");
    const qIdx = e.target.getAttribute("data-line-qty");
    if (pIdx !== null) lines[pIdx].productId = e.target.value;
    if (qIdx !== null) lines[qIdx].qty = e.target.value;
    updateTotal();
  });
  $("#noLines").addEventListener("click", (e) => {
    const rIdx = e.target.closest("[data-line-remove]")?.getAttribute("data-line-remove");
    if (rIdx === undefined || rIdx === null) return;
    lines.splice(Number(rIdx), 1);
    renderLines();
  });
  $$("[data-no-type]").forEach((b) => b.addEventListener("click", () => {
    noType = b.dataset.noType;
    $$("[data-no-type]").forEach((x) => x.classList.toggle("btn-primary", x === b));
    $$("[data-no-type]").forEach((x) => x.classList.toggle("btn-outline", x !== b));
    $("#noAddressField").hidden = noType !== "entrega";
    updateTotal();
  }));

  $("#newOrderForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = $("#noError");
    errEl.style.display = "none";
    const customerName = $("#noName").value.trim();
    const phone = $("#noPhone").value.trim();
    const address = $("#noAddress")?.value.trim() || "";
    const items = lines
      .filter((l) => l.productId && Number(l.qty) > 0)
      .map((l) => {
        const p = activeProducts.find((x) => x.id === l.productId);
        return p ? { productId: p.id, name: p.name, price: p.price, qty: Number(l.qty) } : null;
      })
      .filter(Boolean);
    if (!customerName) return showNoError("Informe o nome do cliente.");
    if (!phone) return showNoError("Informe o telefone do cliente.");
    if (!items.length) return showNoError("Adicione pelo menos um produto.");
    if (noType === "entrega" && !address) return showNoError("Informe o endereço de entrega.");

    const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
    const deliveryFee = noType === "entrega" ? Number(settings.deliveryFee) || 0 : 0;
    const submitBtn = $("#noSubmit");
    submitBtn.disabled = true;
    submitBtn.textContent = "Salvando…";
    try {
      const orderNumber = await nextOrderNumber();
      await addDoc(collection(db, "orders"), {
        orderNumber, customerName, phone, items, subtotal, deliveryFee,
        total: subtotal + deliveryFee, orderType: noType,
        address: noType === "entrega" ? address : "",
        notes: $("#noNotes").value.trim(), paymentMethod: $("#noPayment").value,
        status: "recebido", source: "admin", createdAt: serverTimestamp(),
      });
      closeModal();
    } catch {
      showNoError("Não foi possível salvar o pedido. Tente novamente.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Salvar pedido";
    }
  });
  function showNoError(msg) { const el = $("#noError"); el.textContent = msg; el.style.display = "block"; }
}

    : products.length === 0 ? `<div class="empty-state panel"><svg><use href="#ic-bag"/></svg><p>Nenhum produto cadastrado ainda.</p></div>`
    : `<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th></th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Status</th><th></th></tr></thead><tbody>
      ${products.map((p) => `<tr>

        <td>${p.name}${p.popular ? ` 🔥` : ""}</td>
        <td>${catName(p.categoryId)}</td>
        <td>${money(p.price)}</td>
        <td><button class="status-pill ${p.active !== false ? "pill-active" : "pill-inactive"}" style="border:none;cursor:pointer;" data-toggle-active="${p.id}">${p.active !== false ? "Ativo" : "Inativo"}</button></td>
        <td><div class="row-actions">
          <button class="icon-btn" data-edit-product="${p.id}" aria-label="Editar"><svg><use href="#ic-edit"/></svg></button>
          <button class="icon-btn" data-delete-product="${p.id}" aria-label="Excluir"><svg><use href="#ic-trash"/></svg></button>
        </div></td>
      </tr>`).join("")}
    </tbody></table></div>`}`;

  $("#btnNewProduct")?.addEventListener("click", () => openProductModal(null));

  $$("[data-toggle-active]").forEach((b) => b.addEventListener("click", async () => {
    const p = products.find((x) => x.id === b.dataset.toggleActive);
    if (p) await updateDoc(doc(db, "products", p.id), { active: !(p.active !== false) });
  }));
  $$("[data-delete-product]").forEach((b) => b.addEventListener("click", async () => {
    const p = products.find((x) => x.id === b.dataset.deleteProduct);
    if (!p) return;
    if (!confirm(`Excluir "${p.name}"? Essa ação não pode ser desfeita.`)) return;
    await deleteDoc(doc(db, "products", p.id));
    if (p.imageUrl) { try { await deleteObject(ref(storage, p.imageUrl)); } catch {} }
  }));
}

function openProductModal(product) {
  const isEdit = Boolean(product);
  showModal(`
    <div class="modal-head"><h3>${isEdit ? "Editar produto" : "Novo produto"}</h3><button class="icon-btn" data-close-modal aria-label="Fechar"><svg><use href="#ic-close"/></svg></button></div>
    <form id="productForm">
      <div class="field"><label>Nome</label><input id="pfName" value="${isEdit ? product.name : ""}" required/></div>
      <div class="field"><label>Descrição</label><textarea id="pfDesc" rows="2">${isEdit ? product.description || "" : ""}</textarea></div>
      <div class="field-row">
        <div class="field"><label>Preço (R$)</label><input id="pfPrice" type="number" step="0.01" min="0" value="${isEdit ? product.price : ""}" required/></div>
        <div class="field"><label>Categoria</label><select id="pfCategory">${categories.map((c) => `<option value="${c.id}" ${isEdit && product.categoryId === c.id ? "selected" : ""}>${c.name}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label>Foto do produto</label>
        <div class="image-drop">
          <div class="prev" id="pfPreview">${isEdit && product.imageUrl ? `<img src="${product.imageUrl}"/>` : `<svg><use href="#ic-image"/></svg>`}</div>
          <input type="file" accept="image/*" id="pfFile"/>
        </div>
      </div>
      <label class="check-row"><input type="checkbox" id="pfActive" ${!isEdit || product.active !== false ? "checked" : ""}/> Produto ativo (visível no cardápio)</label>
      <label class="check-row"><input type="checkbox" id="pfPopular" ${isEdit && product.popular ? "checked" : ""}/> Destacar em "Mais pedidos"</label>
      <p id="pfError" style="color:#b23a3a;font-size:.82rem;display:none;margin-bottom:10px;"></p>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" type="submit" id="pfSubmit">Salvar produto</button>
    </form>`);

  let selectedFile = null;
  $("#pfFile").addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    $("#pfPreview").innerHTML = `<span style="font-size:.78rem;">Preparando foto…</span>`;
    selectedFile = await resizeImageFile(file);
    $("#pfPreview").innerHTML = `<img src="${URL.createObjectURL(selectedFile)}"/>`;
  });

  $("#productForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = $("#pfError");
    errEl.style.display = "none";
    const name = $("#pfName").value.trim();
    const price = Number($("#pfPrice").value);
    const categoryId = $("#pfCategory").value;
    if (!name) return showPfError("Informe o nome do produto.");
    if (!price || price <= 0) return showPfError("Informe um preço válido.");
    if (!categoryId) return showPfError("Selecione uma categoria.");

    const submitBtn = $("#pfSubmit");
    submitBtn.disabled = true;
    submitBtn.textContent = "Salvando…";
    try {
      const data = {
        name, description: $("#pfDesc").value.trim(), price, categoryId,
        active: $("#pfActive").checked, popular: $("#pfPopular").checked,
      };
      let id = product?.id;
      if (!isEdit) {
        const docRef = await addDoc(collection(db, "products"), { ...data, imageUrl: "" });
        id = docRef.id;
      }
      if (selectedFile) {
        const path = `products/${id}-${Date.now()}-${selectedFile.name}`;
        const storageRef = ref(storage, path);
        await uploadBytes(storageRef, selectedFile);
        data.imageUrl = await getDownloadURL(storageRef);
        if (isEdit && product.imageUrl) { try { await deleteObject(ref(storage, product.imageUrl)); } catch {} }
      } else {
        data.imageUrl = product?.imageUrl || "";
      }
      await updateDoc(doc(db, "products", id), data);
      closeModal();
    } catch {
      showPfError("Não foi possível salvar o produto. Tente novamente.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Salvar produto";
    }
  });
  function showPfError(msg) { const el = $("#pfError"); el.textContent = msg; el.style.display = "block"; }
}

      </form>

    </div>
    ${categories.length === 0 ? `<div class="empty-state panel"><svg><use href="#ic-tag"/></svg><p>Nenhuma categoria cadastrada ainda.</p></div>`
    : `<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Ordem</th><th>Nome</th><th>Produtos</th><th></th></tr></thead><tbody>
      ${categories.map((c) => {
        const count = products.filter((p) => p.categoryId === c.id).length;
        return `<tr data-cat-row="${c.id}">
          <td class="cat-order-cell">${c.order}</td>
          <td class="cat-name-cell">${c.name}</td>
          <td>${count}</td>
          <td><div class="row-actions">
            <button class="icon-btn" data-edit-cat="${c.id}" aria-label="Editar"><svg><use href="#ic-edit"/></svg></button>
            <button class="icon-btn" data-delete-cat="${c.id}" aria-label="Excluir"><svg><use href="#ic-trash"/></svg></button>
          </div></td>
        </tr>`;
      }).join("")}
    </tbody></table></div>`}`;

  $("#catForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = $("#catName").value.trim();
    const order = Number($("#catOrder").value) || categories.length + 1;
    if (!name) { const el = $("#catError"); el.textContent = "Informe o nome da categoria."; el.style.display = "block"; return; }
    await addDoc(collection(db, "categories"), { name, order });
  });

  $$("[data-edit-cat]").forEach((b) => b.addEventListener("click", () => {
    const c = categories.find((x) => x.id === b.dataset.editCat);
    const row = document.querySelector(`tr[data-cat-row="${c.id}"]`);
    row.querySelector(".cat-order-cell").innerHTML = `<input type="number" value="${c.order}" style="width:70px;" id="editOrder-${c.id}"/>`;
    row.querySelector(".cat-name-cell").innerHTML = `<input value="${c.name}" id="editName-${c.id}"/>`;
    row.querySelector(".row-actions").innerHTML = `<button class="btn btn-sm btn-primary" data-save-cat="${c.id}">Salvar</button><button class="btn btn-sm btn-outline" data-cancel-cat="${c.id}">Cancelar</button>`;
    row.querySelector(`[data-save-cat]`).addEventListener("click", async () => {
      const newName = $(`#editName-${c.id}`).value.trim();
      const newOrder = Number($(`#editOrder-${c.id}`).value) || 1;
      await updateDoc(doc(db, "categories", c.id), { name: newName, order: newOrder });
    });
    row.querySelector(`[data-cancel-cat]`).addEventListener("click", renderCategories);
  }));
  $$("[data-delete-cat]").forEach((b) => b.addEventListener("click", async () => {
    const c = categories.find((x) => x.id === b.dataset.deleteCat);
    if (!c) return;
    const inUse = products.some((p) => p.categoryId === c.id);
    if (inUse) return alert(`Não é possível excluir "${c.name}": há produtos cadastrados nessa categoria. Mova ou exclua os produtos primeiro.`);
    if (!confirm(`Excluir a categoria "${c.name}"?`)) return;
    await deleteDoc(doc(db, "categories", c.id));
  }));
}

    msgEl.textContent = "Importando…";
    try {
      const existing = await getDocs(collection(db, "categories"));
      if (!existing.empty) throw new Error("Já existem categorias cadastradas. Remova-as antes de importar os dados de exemplo, se quiser recomeçar.");
      const idByName = {};
      for (const cat of SEED_CATEGORIES) {
        const ref2 = await addDoc(collection(db, "categories"), cat);
        idByName[cat.name] = ref2.id;
      }
      for (const p of SEED_PRODUCTS) {
        const { categoryName, ...rest } = p;
        await addDoc(collection(db, "products"), { ...rest, categoryId: idByName[categoryName] || "", imageUrl: "", active: true, popular: !!p.popular });
      }
      await setDoc(doc(db, "settings", "store"), DEFAULT_SETTINGS, { merge: true });
      msgEl.textContent = "Dados de exemplo carregados com sucesso!";
    } catch (err) {
      msgEl.textContent = err.message || "Não foi possível importar os dados de exemplo.";
    }
  });
}

================================================================== */
function showModal(innerHTML) {
  const root = $("#modalRoot");
  root.innerHTML = `<div class="modal-overlay" id="genericModalOverlay"><div class="modal-box">${innerHTML}</div></div>`;
  $("#genericModalOverlay").addEventListener("click", (e) => { if (e.target.id === "genericModalOverlay") closeModal(); });
  $$("[data-close-modal]", root).forEach((b) => b.addEventListener("click", closeModal));
}
function closeModal() { $("#modalRoot").innerHTML = ""; }

</script>
