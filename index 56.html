<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Doce Gestão</title>
<meta name="theme-color" content="#7B4B2A">
<style>
:root{
  --brown-900:#3D2418;
  --brown-800:#5C3A24;
  --brown-700:#7B4B2A;
  --brown-600:#9C6B3E;
  --brown-100:#F3E7DA;
  --cream:#FBF6F0;
  --pink-500:#D98BA7;
  --pink-100:#FBE9F0;
  --green-600:#2E9E6B;
  --green-100:#E4F7EE;
  --red-600:#D6483F;
  --red-100:#FBE7E5;
  --amber-600:#C98A2E;
  --amber-100:#FBF0DD;
  --ink:#2B231D;
  --muted:#8A7A6D;
  --border:#EBDFD2;
  --white:#FFFFFF;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 2px 10px rgba(61,36,24,0.06), 0 1px 2px rgba(61,36,24,0.04);
  --shadow-lg:0 12px 32px rgba(61,36,24,0.14);
  --sidebar-w:248px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--brown-100);border-radius:8px;}
.svg-ico{display:inline-block;vertical-align:middle;flex-shrink:0;}

/* ---------- Loading / Auth ---------- */
#boot-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--cream);z-index:9999;flex-direction:column;gap:12px;}
.boot-logo{color:var(--brown-700);display:flex;align-items:center;justify-content:center;}
.spinner{width:28px;height:28px;border:3px solid var(--brown-100);border-top-color:var(--brown-700);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#3D2418 0%,#7B4B2A 55%,#C98A2E 100%);padding:20px;}
.auth-card{background:var(--white);border-radius:20px;box-shadow:var(--shadow-lg);padding:36px 32px;width:100%;max-width:380px;}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;justify-content:center;}
.auth-brand .icon{color:var(--brown-700);display:flex;align-items:center;justify-content:center;}
.auth-brand h1{font-size:20px;color:var(--brown-900);}
.auth-tabs{display:flex;background:var(--brown-100);border-radius:12px;padding:4px;margin-bottom:20px;}
.auth-tab{flex:1;text-align:center;padding:8px 0;border:none;background:transparent;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);transition:.15s;}
.auth-tab.active{background:var(--white);color:var(--brown-800);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--brown-800);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;
  font-size:14.5px;color:var(--ink);background:var(--cream);transition:.15s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brown-600);background:var(--white);}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
.field .error{font-size:11.5px;color:var(--red-600);margin-top:4px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:11px;border:none;font-weight:600;font-size:14px;
  transition:.15s;white-space:nowrap;
}
.btn-primary{background:var(--brown-700);color:var(--white);}
.btn-primary:hover{background:var(--brown-800);}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;}
.btn-block{width:100%;}
.btn-ghost{background:transparent;color:var(--brown-700);border:1.5px solid var(--border);}
.btn-ghost:hover{background:var(--brown-100);}
.btn-danger{background:var(--red-100);color:var(--red-600);}
.btn-danger:hover{background:#F7D5D2;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px;}
.auth-error{background:var(--red-100);color:var(--red-600);padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px;}
.auth-foot{text-align:center;margin-top:16px;font-size:12.5px;color:var(--muted);}

/* ---------- App shell ---------- */
#app-shell{display:none;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);background:var(--brown-900);color:#fff;position:fixed;left:0;top:0;bottom:0;
  display:flex;flex-direction:column;padding:20px 14px;z-index:200;
}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px;}
.sidebar-brand .icon{color:var(--pink-500);display:flex;align-items:center;justify-content:center;}
.sidebar-brand .name{font-size:15.5px;font-weight:700;color:#fff;}
.sidebar-brand .owner{font-size:11.5px;color:#C9AE93;}
.nav-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:#D9C7B4;
  font-size:14px;font-weight:500;cursor:pointer;transition:.12s;
}
.nav-item .ic{width:20px;display:inline-flex;align-items:center;justify-content:center;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--brown-700);color:#fff;font-weight:600;}
.sidebar-foot{border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;margin-top:8px;}
.sidebar-user{display:flex;align-items:center;gap:9px;padding:8px 10px;font-size:12.5px;color:#C9AE93;}
.sidebar-logout{width:100%;text-align:left;}

.main-area{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  display:none;align-items:center;justify-content:space-between;padding:14px 16px;
  background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;
}
.topbar .icon-btn{background:none;border:none;padding:6px;color:var(--brown-800);display:inline-flex;align-items:center;justify-content:center;}
.topbar .tb-title{font-size:16px;font-weight:700;color:var(--brown-900);}
.page{padding:24px 28px 100px;max-width:1180px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
.page-head h2{font-size:22px;color:var(--brown-900);}
.page-head .sub{font-size:13px;color:var(--muted);margin-top:3px;}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);z-index:200;padding:6px 2px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 14px rgba(0,0,0,0.05);}
.bn-scroll{display:flex;overflow-x:auto;gap:2px;}
.bn-item{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;color:var(--muted);font-size:10.5px;font-weight:600;border:none;background:none;min-width:56px;}
.bn-item .ic{display:flex;align-items:center;justify-content:center;}
.bn-item.active{color:var(--brown-700);}

.mobile-drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;}
.mobile-drawer{position:fixed;left:0;top:0;bottom:0;width:78vw;max-width:290px;background:var(--brown-900);z-index:301;transform:translateX(-100%);transition:transform .2s;padding:20px 14px;}
.mobile-drawer.open{transform:translateX(0);}
.mobile-drawer-overlay.open{display:block;}

/* ---------- Common widgets ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{background:var(--white);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--border);transition:.15s;}
.stat-card[data-nav-card]:hover,.stat-card[data-nav-card]:focus-visible{box-shadow:var(--shadow-lg);transform:translateY(-1px);outline:none;}
.stat-card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.stat-card .label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.stat-card .ic-badge{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.stat-card .val{font-size:24px;font-weight:800;color:var(--brown-900);}
.stat-card .val.small{font-size:19px;}
.stat-card .foot{font-size:11.5px;color:var(--muted);margin-top:6px;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
.badge-green{background:var(--green-100);color:var(--green-600);}
.badge-red{background:var(--red-100);color:var(--red-600);}
.badge-amber{background:var(--amber-100);color:var(--amber-600);}
.badge-brown{background:var(--brown-100);color:var(--brown-700);}

.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:20px;margin-bottom:18px;}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.card-head h3{font-size:15.5px;color:var(--brown-900);}

.section-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:860px){.section-2col{grid-template-columns:1fr;}}

table.dtable{width:100%;border-collapse:collapse;font-size:13.5px;}
table.dtable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;padding:0 10px 10px;border-bottom:1.5px solid var(--border);}
table.dtable td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.dtable tr:last-child td{border-bottom:none;}
table.dtable td.num{text-align:right;font-variant-numeric:tabular-nums;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state .ic{margin-bottom:8px;display:flex;align-items:center;justify-content:center;color:var(--brown-600);opacity:.7;}
.empty-state .msg{font-size:13.5px;}

.list-cards{display:flex;flex-direction:column;gap:10px;}
.list-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
.list-card .lc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.list-card .lc-title{font-weight:700;font-size:14.5px;color:var(--brown-900);}
.list-card .lc-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.list-card .lc-val{font-weight:800;font-size:15px;}
.list-card .lc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted);}

.fab{position:fixed;right:20px;bottom:76px;z-index:150;width:54px;height:54px;border-radius:50%;background:var(--brown-700);color:#fff;border:none;font-size:26px;line-height:1;box-shadow:var(--shadow-lg);display:none;align-items:center;justify-content:center;}
@media(max-width:860px){.fab{display:flex;}}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.search-input{flex:1;min-width:160px;}
.tag-select{display:flex;gap:6px;flex-wrap:wrap;}
.tag-btn{padding:6px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);font-size:12.5px;font-weight:600;color:var(--muted);}
.tag-btn.active{background:var(--brown-700);border-color:var(--brown-700);color:#fff;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(43,35,29,.5);z-index:500;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:700px){.modal-overlay{align-items:center;}}
.modal{background:var(--white);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:22px 22px 26px;}
@media(min-width:700px){.modal{border-radius:20px;}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-head h3{font-size:17px;color:var(--brown-900);}
.modal-close{background:var(--brown-100);border:none;width:30px;height:30px;border-radius:50%;color:var(--brown-800);display:inline-flex;align-items:center;justify-content:center;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions .btn{flex:1;}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
@media(max-width:480px){.form-grid-2{grid-template-columns:1fr;}}
.ingredient-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--border);}
.ingredient-row .field{margin-bottom:0;flex:1;}
.remove-row-btn{background:var(--red-100);color:var(--red-600);border:none;width:34px;height:38px;border-radius:9px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;}
.add-row-btn{background:var(--brown-100);color:var(--brown-800);border:none;padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;width:100%;margin-top:2px;}

.toast-wrap{position:fixed;top:18px;right:18px;z-index:900;display:flex;flex-direction:column;gap:8px;}
@media(max-width:600px){.toast-wrap{left:12px;right:12px;top:12px;}}
.toast{background:var(--brown-900);color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastIn .2s;min-width:200px;}
.toast.success{background:var(--green-600);}
.toast.error{background:var(--red-600);}
@keyframes toastIn{from{transform:translateY(-8px);opacity:0;}to{transform:translateY(0);opacity:1;}}

.confirm-overlay{position:fixed;inset:0;background:rgba(43,35,29,.5);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px;}
.confirm-box{background:#fff;border-radius:18px;padding:24px;max-width:360px;width:100%;text-align:center;}
.confirm-box .ic{margin-bottom:10px;display:flex;align-items:center;justify-content:center;}
.confirm-box h4{font-size:16px;margin-bottom:8px;color:var(--brown-900);}
.confirm-box p{font-size:13.5px;color:var(--muted);margin-bottom:18px;line-height:1.4;}
.confirm-actions{display:flex;gap:10px;}
.confirm-actions .btn{flex:1;}

.skeleton{background:linear-gradient(90deg,var(--border) 25%,#f5ede2 37%,var(--border) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:8px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

.checkbox-row{display:flex;align-items:center;gap:10px;}
.checkbox-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--brown-700);}

.low-stock-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--red-600);}

@media(max-width:980px){
  .sidebar{display:none;}
  .main-area{margin-left:0;}
  .topbar{display:flex;}
  .bottom-nav{display:block;}
  .page{padding:16px 14px 90px;}
  .grid-cards{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:480px){
  .grid-cards{grid-template-columns:1fr 1fr;}
  .page-head{flex-direction:column;align-items:flex-start;}
}
.hide-desktop{display:none;}
@media(max-width:980px){.hide-desktop{display:block;} .hide-mobile{display:none;}}

<script type="module">
// ============================================================
// LÓGICA DE NEGÓCIO PURA (antes em logic.mjs) — inlined abaixo
// ============================================================
// ============================================================
// LÓGICA DE NEGÓCIO PURA — sem dependência de Firebase/DOM.
// Cada função recebe o estado necessário e retorna um objeto
// descrevendo exatamente quais escritas devem ser feitas.
// Isso permite testar toda a regra financeira isoladamente
// antes de conectar ao Firestore (que só executa as escritas
// dentro de uma transação atômica).
// ============================================================

function round2(n) {
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

function genId() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

function nowISO() {
  return new Date().toISOString();
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

// ---------- Conversão de unidades (para permitir receita em g/ml
// enquanto o estoque guarda em kg/L, por exemplo) ----------
const UNIT_FACTORS = {
  // massa, base = g
  g: 1, kg: 1000,
  // volume, base = ml
  ml: 1, l: 1000,
  // unidade, base = un
  un: 1,
};
const UNIT_GROUP = {
  g: 'massa', kg: 'massa',
  ml: 'volume', l: 'volume',
  un: 'unidade',
};

function unidadesCompativeis(u1, u2) {
  return UNIT_GROUP[u1] && UNIT_GROUP[u1] === UNIT_GROUP[u2];
}

// converte `qty` na unidade `fromUnit` para a unidade `toUnit`
function converterQuantidade(qty, fromUnit, toUnit) {
  if (fromUnit === toUnit) return qty;
  if (!unidadesCompativeis(fromUnit, toUnit)) {
    throw new Error(`Unidades incompatíveis: ${fromUnit} e ${toUnit}`);
  }
  const base = qty * (UNIT_FACTORS[fromUnit] ?? 1);
  return base / (UNIT_FACTORS[toUnit] ?? 1);
}

// ============================================================
// RECEITAS — cálculo de custo
// ============================================================
// receita.ingredientes: [{ ingredienteId, quantidade, unidade }]
// ingredientesMap: { [id]: { nome, unidade, custoUnitario, quantidade } }
function calcularCustoReceita(receita, ingredientesMap) {
  let custoTotal = 0;
  const itens = [];
  const faltando = [];

  for (const item of receita.ingredientes || []) {
    const ing = ingredientesMap[item.ingredienteId];
    if (!ing) {
      faltando.push({ ingredienteId: item.ingredienteId, nome: '(ingrediente removido)' });
      continue;
    }
    let qtyNaUnidadeEstoque;
    try {
      qtyNaUnidadeEstoque = converterQuantidade(item.quantidade, item.unidade, ing.unidade);
    } catch (e) {
      qtyNaUnidadeEstoque = item.quantidade; // fallback: assume mesma unidade
    }
    const custoItem = round2(qtyNaUnidadeEstoque * (ing.custoUnitario || 0));
    custoTotal = round2(custoTotal + custoItem);
    itens.push({
      ingredienteId: item.ingredienteId,
      nome: ing.nome,
      quantidade: item.quantidade,
      unidade: item.unidade,
      custoUnitario: ing.custoUnitario || 0,
      custoItem,
    });
  }

  const rendimento = receita.rendimento && receita.rendimento > 0 ? receita.rendimento : 1;
  const custoPorUnidade = round2(custoTotal / rendimento);

  return { custoTotal, custoPorUnidade, itens, faltando };
}

// ============================================================
// PRODUÇÃO
// ============================================================
// Verifica se há estoque suficiente para produzir `quantidadeProduzir`
// vezes o rendimento da receita (na verdade: quantidadeProduzir é o
// número de lotes/unidades finais desejadas; escalamos os ingredientes
// proporcionalmente ao rendimento da receita).
function checarEstoqueParaProducao(receita, quantidadeProduzir, ingredientesMap) {
  const rendimento = receita.rendimento && receita.rendimento > 0 ? receita.rendimento : 1;
  const fator = quantidadeProduzir / rendimento;
  const faltantes = [];
  const consumo = [];

  for (const item of receita.ingredientes || []) {
    const ing = ingredientesMap[item.ingredienteId];
    if (!ing) {
      faltantes.push({ nome: '(ingrediente removido)', necessario: 0, disponivel: 0 });
      continue;
    }
    const necessarioNaUnidadeReceita = round2(item.quantidade * fator);
    let necessarioNaUnidadeEstoque;
    try {
      necessarioNaUnidadeEstoque = converterQuantidade(necessarioNaUnidadeReceita, item.unidade, ing.unidade);
    } catch (e) {
      necessarioNaUnidadeEstoque = necessarioNaUnidadeReceita;
    }
    necessarioNaUnidadeEstoque = round2(necessarioNaUnidadeEstoque);
    if (necessarioNaUnidadeEstoque > (ing.quantidade || 0) + 1e-9) {
      faltantes.push({
        ingredienteId: item.ingredienteId,
        nome: ing.nome,
        necessario: necessarioNaUnidadeEstoque,
        disponivel: ing.quantidade || 0,
        unidade: ing.unidade,
      });
    }
    consumo.push({ ingredienteId: item.ingredienteId, quantidadeConsumida: necessarioNaUnidadeEstoque, unidade: ing.unidade });
  }

  return { ok: faltantes.length === 0, faltantes, consumo, fator };
}

// Retorna a lista de escritas para confirmar uma produção.
// Lança erro se não houver estoque suficiente (o chamador deve
// checar `checarEstoqueParaProducao` antes, mas validamos de novo
// aqui por segurança — a mesma função é usada dentro da transação
// do Firestore para evitar condição de corrida).
function aplicarProducao({ receita, quantidadeProduzir, ingredientesMap, produtoAtual }) {
  if (!quantidadeProduzir || quantidadeProduzir <= 0) {
    throw new Error('Quantidade produzida deve ser maior que zero.');
  }
  const check = checarEstoqueParaProducao(receita, quantidadeProduzir, ingredientesMap);
  if (!check.ok) {
    const nomes = check.faltantes.map(f => f.nome).join(', ');
    const err = new Error(`Estoque insuficiente de: ${nomes}`);
    err.faltantes = check.faltantes;
    throw err;
  }

  const custoInfo = calcularCustoReceita(receita, ingredientesMap);
  const fatorCusto = quantidadeProduzir / (receita.rendimento || 1);
  const custoTotalProducao = round2(custoInfo.custoTotal * fatorCusto);

  const ingredientesAtualizados = check.consumo.map(c => ({
    ingredienteId: c.ingredienteId,
    novaQuantidade: round2((ingredientesMap[c.ingredienteId].quantidade || 0) - c.quantidadeConsumida),
  }));

  const novaQuantidadeProduto = round2((produtoAtual?.quantidade || 0) + quantidadeProduzir);

  const producaoDoc = {
    id: genId(),
    receitaId: receita.id,
    receitaNome: receita.nome,
    quantidade: quantidadeProduzir,
    custoTotal: custoTotalProducao,
    custoPorUnidade: round2(custoTotalProducao / quantidadeProduzir),
    ingredientesConsumidos: check.consumo,
    data: nowISO(),
  };

  return {
    producaoDoc,
    ingredientesAtualizados,
    produtoAtualizado: { novaQuantidade: novaQuantidadeProduto, custoUnitario: round2(custoTotalProducao / quantidadeProduzir) },
  };
}

// ============================================================
// VENDAS
// ============================================================
// vendaInput: { cliente, itens: [{produtoId, nome, quantidade, valorUnitario, desconto}], formaPagamento, status, data }
// produtosMap: { [id]: { nome, quantidade } }
function aplicarVenda({ vendaInput, produtosMap }) {
  if (!vendaInput.itens || vendaInput.itens.length === 0) {
    throw new Error('A venda precisa ter ao menos um produto.');
  }
  const faltantes = [];
  let total = 0;
  const itensProcessados = [];

  for (const item of vendaInput.itens) {
    if (!item.quantidade || item.quantidade <= 0) throw new Error('Quantidade deve ser maior que zero.');
    if (item.valorUnitario == null || item.valorUnitario < 0) throw new Error('Valor unitário inválido.');
    const produto = produtosMap[item.produtoId];
    const disponivel = produto?.quantidade || 0;
    if (item.quantidade > disponivel + 1e-9) {
      faltantes.push({ nome: produto?.nome || item.nome, necessario: item.quantidade, disponivel });
      continue;
    }
    const desconto = item.desconto || 0;
    const subtotal = round2(item.quantidade * item.valorUnitario - desconto);
    total = round2(total + subtotal);
    itensProcessados.push({ ...item, subtotal });
  }

  if (faltantes.length) {
    const err = new Error('Estoque insuficiente para: ' + faltantes.map(f => f.nome).join(', '));
    err.faltantes = faltantes;
    throw err;
  }

  const vendaId = genId();
  const vendaDoc = {
    id: vendaId,
    cliente: vendaInput.cliente || '',
    itens: itensProcessados,
    total,
    formaPagamento: vendaInput.formaPagamento || '',
    status: vendaInput.status === 'pago' ? 'pago' : 'pendente',
    data: vendaInput.data || nowISO(),
  };

  const produtosAtualizados = itensProcessados.map(item => ({
    produtoId: item.produtoId,
    novaQuantidade: round2((produtosMap[item.produtoId].quantidade || 0) - item.quantidade),
  }));

  let movimentacaoCaixa = null;
  let contaReceber = null;

  if (vendaDoc.status === 'pago') {
    movimentacaoCaixa = {
      id: genId(),
      data: vendaDoc.data,
      tipo: 'entrada',
      categoria: 'Venda',
      descricao: `Venda${vendaDoc.cliente ? ' - ' + vendaDoc.cliente : ''}`,
      valor: total,
      origem: 'venda',
      origemId: vendaId,
    };
  } else {
    contaReceber = {
      id: genId(),
      vendaId,
      cliente: vendaDoc.cliente || '(sem nome)',
      descricao: `Venda${vendaDoc.cliente ? ' - ' + vendaDoc.cliente : ''}`,
      valor: total,
      data: vendaDoc.data,
      vencimento: vendaInput.vencimento || vendaDoc.data,
      status: 'pendente',
    };
  }

  return { vendaDoc, produtosAtualizados, movimentacaoCaixa, contaReceber };
}

// ============================================================
// A RECEBER / A PAGAR — marcar como recebido/pago (idempotente)
// ============================================================
function aplicarMarcarRecebido(contaReceber) {
  if (contaReceber.status === 'recebido') {
    return { noop: true, motivo: 'Já estava marcado como recebido.' };
  }
  const movimentacaoCaixa = {
    id: genId(),
    data: nowISO(),
    tipo: 'entrada',
    categoria: 'Recebimento',
    descricao: contaReceber.descricao || `Recebimento - ${contaReceber.cliente}`,
    valor: contaReceber.valor,
    origem: 'recebimento',
    origemId: contaReceber.id,
  };
  return { noop: false, movimentacaoCaixa, novoStatus: 'recebido' };
}

function aplicarMarcarPago(contaPagar) {
  if (contaPagar.status === 'pago') {
    return { noop: true, motivo: 'Já estava marcado como pago.' };
  }
  const movimentacaoCaixa = {
    id: genId(),
    data: nowISO(),
    tipo: 'saida',
    categoria: contaPagar.categoria || 'Conta paga',
    descricao: contaPagar.descricao || `Pagamento - ${contaPagar.fornecedor || ''}`,
    valor: contaPagar.valor,
    origem: 'conta_paga',
    origemId: contaPagar.id,
  };
  return { noop: false, movimentacaoCaixa, novoStatus: 'pago' };
}

// ============================================================
// ESTOQUE — reposição
// ============================================================
// item: { id, nome, quantidade, custoUnitario }
// input: { quantidadeAdicionada, custoUnitario (novo, opcional), formaPagamento: 'imediato' | 'prazo', vencimento? }
function aplicarReposicaoEstoque({ item, input }) {
  if (!input.quantidadeAdicionada || input.quantidadeAdicionada <= 0) {
    throw new Error('Quantidade a repor deve ser maior que zero.');
  }
  const novoCustoUnitario = input.custoUnitario != null ? input.custoUnitario : item.custoUnitario;
  const novaQuantidade = round2((item.quantidade || 0) + input.quantidadeAdicionada);
  const valorCompra = round2(input.quantidadeAdicionada * novoCustoUnitario);

  const itemAtualizado = { novaQuantidade, novoCustoUnitario };

  let movimentacaoCaixa = null;
  let contaPagar = null;

  if (input.formaPagamento === 'prazo') {
    contaPagar = {
      id: genId(),
      descricao: `Compra de ${item.nome}`,
      fornecedor: item.fornecedor || input.fornecedor || '',
      valor: valorCompra,
      vencimento: input.vencimento || todayStr(),
      categoria: 'Reposição de estoque',
      status: 'pendente',
      data: nowISO(),
    };
  } else {
    movimentacaoCaixa = {
      id: genId(),
      data: nowISO(),
      tipo: 'saida',
      categoria: 'Compra',
      descricao: `Compra de ${item.nome}`,
      valor: valorCompra,
      origem: 'compra',
      origemId: item.id,
    };
  }

  return { itemAtualizado, movimentacaoCaixa, contaPagar, valorCompra };
}

// ============================================================
// SAÍDAS (despesas) e RETIRADAS
// ============================================================
function aplicarDespesa(input) {
  if (!input.valor || input.valor <= 0) throw new Error('Valor deve ser maior que zero.');
  const despesaId = genId();
  const despesaDoc = {
    id: despesaId,
    descricao: input.descricao || '',
    categoria: input.categoria || 'Outros',
    valor: input.valor,
    data: input.data || nowISO(),
    observacao: input.observacao || '',
  };
  const movimentacaoCaixa = {
    id: genId(),
    data: despesaDoc.data,
    tipo: 'saida',
    categoria: despesaDoc.categoria,
    descricao: despesaDoc.descricao || 'Despesa',
    valor: despesaDoc.valor,
    origem: 'despesa',
    origemId: despesaId,
  };
  return { despesaDoc, movimentacaoCaixa };
}

function aplicarRetirada(input) {
  if (!input.valor || input.valor <= 0) throw new Error('Valor deve ser maior que zero.');
  const retiradaId = genId();
  const retiradaDoc = {
    id: retiradaId,
    valor: input.valor,
    data: input.data || nowISO(),
    motivo: input.motivo || '',
    observacao: input.observacao || '',
  };
  const movimentacaoCaixa = {
    id: genId(),
    data: retiradaDoc.data,
    tipo: 'saida',
    categoria: 'Retirada',
    descricao: `Retirada${retiradaDoc.motivo ? ' - ' + retiradaDoc.motivo : ''}`,
    valor: retiradaDoc.valor,
    origem: 'retirada',
    origemId: retiradaId,
  };
  return { retiradaDoc, movimentacaoCaixa };
}

// ============================================================
// CAIXA — cálculo de saldo
// ============================================================
function calcularSaldoCaixa(movimentacoes) {
  let entradas = 0, saidas = 0;
  for (const m of movimentacoes || []) {
    if (m.tipo === 'entrada') entradas = round2(entradas + m.valor);
    else if (m.tipo === 'saida') saidas = round2(saidas + m.valor);
  }
  return { entradas, saidas, saldo: round2(entradas - saidas) };
}

// ============================================================
// DASHBOARD — resumo
// ============================================================
function calcularResumoDashboard({ movimentacoes, vendas, contasReceber, contasPagar, produtos, mesRef }) {
  const { saldo } = calcularSaldoCaixa(movimentacoes);
  const mes = mesRef || todayStr().slice(0, 7); // YYYY-MM

  const vendasDoMes = (vendas || []).filter(v => (v.data || '').slice(0, 7) === mes);
  const totalVendasMes = round2(vendasDoMes.reduce((acc, v) => acc + (v.total || 0), 0));

  const aReceberPendente = round2((contasReceber || []).filter(c => c.status === 'pendente').reduce((a, c) => a + c.valor, 0));
  const aPagarPendente = round2((contasPagar || []).filter(c => c.status === 'pendente').reduce((a, c) => a + c.valor, 0));

  const produtosProntos = (produtos || []).filter(p => p.tipo === 'produto');
  const qtdProdutosProntos = round2(produtosProntos.reduce((a, p) => a + (p.quantidade || 0), 0));

  const estoqueBaixo = (produtos || []).filter(p => (p.quantidade || 0) < (p.estoqueMinimo || 0));

  return {
    saldoCaixa: saldo,
    vendasDoMes: totalVendasMes,
    aReceberPendente,
    aPagarPendente,
    qtdProdutosProntos,
    estoqueBaixo,
  };
}

function fmtMoeda(v) {
  return (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function fmtData(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR');
}
function fmtDataHora(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function ico(name, size = 18) {
  const body = ICONS[name] || '';
  return `<svg class="svg-ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;

// 4) TOAST / CONFIRM / MODAL
// ------------------------------------------------------------
function toast(msg, type = 'default') {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span style="display:inline-flex;">${type === 'success' ? ico('checkCircle', 18) : type === 'error' ? ico('alertTriangle', 18) : ico('info', 18)}</span><span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 3200);
}

function confirmDialog({ title, message, confirmLabel = 'Confirmar', danger = false }) {
  return new Promise(resolve => {
    const root = document.getElementById('confirm-root');
    root.innerHTML = `
      <div class="confirm-overlay">
        <div class="confirm-box">
          <div class="ic">${danger ? ico('alertTriangle', 30) : ico('helpCircle', 30)}</div>
          <h4>${esc(title)}</h4>
          <p>${esc(message)}</p>
          <div class="confirm-actions">
            <button class="btn btn-ghost" id="confirm-no">Cancelar</button>
            <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="confirm-yes">${esc(confirmLabel)}</button>
          </div>
        </div>
      </div>`;
    root.querySelector('#confirm-no').onclick = () => { root.innerHTML = ''; resolve(false); };
    root.querySelector('#confirm-yes').onclick = () => { root.innerHTML = ''; resolve(true); };
  });
}

function openModal(title, bodyHTML, { onMount, size } = {}) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" style="${size === 'lg' ? 'max-width:640px' : ''}">
        <div class="modal-head"><h3>${esc(title)}</h3><button class="modal-close" id="modal-close-btn">${ico('x', 15)}</button></div>
        <div id="modal-body">${bodyHTML}</div>
      </div>
    </div>`;
  const overlay = root.querySelector('#modal-overlay');
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  root.querySelector('#modal-close-btn').onclick = closeModal;
  if (onMount) onMount(root.querySelector('#modal-body'));
}
function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
}

function setBtnLoading(btn, loading, labelLoading = 'Salvando...') {
  if (!btn) return;
  if (loading) {
    btn.dataset.originalLabel = btn.innerHTML;
    btn.innerHTML = `<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> ${labelLoading}`;
    btn.disabled = true;
  } else {
    btn.innerHTML = btn.dataset.originalLabel || btn.innerHTML;
    btn.disabled = false;
  }
}

function renderAuthScreen(mode = 'login') {
  const el = document.getElementById('auth-screen');
  el.style.display = 'flex';
  el.innerHTML = `
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand"><span class="icon">${ico('drop', 30)}</span><h1>Doce Gestão</h1></div>
      <div class="auth-tabs">
        <button class="auth-tab ${mode === 'login' ? 'active' : ''}" id="tab-login">Entrar</button>
        <button class="auth-tab ${mode === 'signup' ? 'active' : ''}" id="tab-signup">Criar conta</button>
      </div>
      <div id="auth-error"></div>
      <form id="auth-form">
        <div class="field"><label>E-mail</label><input type="email" id="auth-email" required autocomplete="email"></div>
        <div class="field"><label>Senha</label><input type="password" id="auth-password" required autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}" minlength="6"></div>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit">${mode === 'login' ? 'Entrar' : 'Criar conta'}</button>
      </form>
      <div class="auth-foot">${mode === 'login' ? '<a href="#" id="link-forgot">Esqueci minha senha</a>' : 'Seus dados ficam isolados e privados.'}</div>
    </div>
  </div>`;
  el.querySelector('#tab-login').onclick = () => renderAuthScreen('login');
  el.querySelector('#tab-signup').onclick = () => renderAuthScreen('signup');
  const forgotLink = el.querySelector('#link-forgot');
  if (forgotLink) forgotLink.onclick = async (e) => {
    e.preventDefault();
    const email = el.querySelector('#auth-email').value.trim();
    if (!email) { showAuthError('Digite seu e-mail para receber o link de redefinição.'); return; }
    try { await sendPasswordResetEmail(auth, email); toast('E-mail de redefinição enviado.', 'success'); }
    catch (err) { showAuthError(traduzErroFirebase(err)); }
  };
  el.querySelector('#auth-form').onsubmit = async (e) => {
    e.preventDefault();
    const email = el.querySelector('#auth-email').value.trim();
    const password = el.querySelector('#auth-password').value;
    const btn = el.querySelector('#auth-submit');
    setBtnLoading(btn, true, mode === 'login' ? 'Entrando...' : 'Criando...');
    try {
      if (mode === 'login') await signInWithEmailAndPassword(auth, email, password);
      else await createUserWithEmailAndPassword(auth, email, password);
    } catch (err) {
      showAuthError(traduzErroFirebase(err));
      setBtnLoading(btn, false);
    }
  };
}
function showAuthError(msg) {
  document.getElementById('auth-error').innerHTML = `<div class="auth-error">${esc(msg)}</div>`;
}
function traduzErroFirebase(err) {
  const code = err?.code || '';
  const map = {
    'auth/invalid-email': 'E-mail inválido.',
    'auth/user-not-found': 'Usuário não encontrado.',
    'auth/wrong-password': 'Senha incorreta.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/email-already-in-use': 'Este e-mail já está cadastrado.',
    'auth/weak-password': 'A senha precisa ter ao menos 6 caracteres.',
    'auth/too-many-requests': 'Muitas tentativas. Tente novamente mais tarde.',
    'auth/network-request-failed': 'Falha de conexão. Verifique sua internet.',
  };
  return map[code] || ('Erro: ' + (err?.message || 'tente novamente.'));
}
async function handleLogout() {
  const ok = await confirmDialog({ title: 'Sair da conta', message: 'Deseja realmente sair?', confirmLabel: 'Sair' });
  if (ok) await signOut(auth);
}

onAuthStateChanged(auth, (user) => {
  document.getElementById('boot-screen').style.display = 'none';
  if (user) {
    state.user = user;
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-shell').style.display = 'block';
    startListeners(user.uid);
  } else {
    state.user = null;
    stopListeners();
    document.getElementById('app-shell').style.display = 'none';
    renderAuthScreen('login');
  }
});

// ------------------------------------------------------------
// 7) LISTENERS FIRESTORE (tempo real, escopados por usuário)
// ------------------------------------------------------------
function userCol(uid, name) {
  return collection(db, 'users', uid, name);
}
function startListeners(uid) {
  stopListeners();
  state.loadingCollections = new Set(['ingredientes', 'produtos', 'vendas', 'contasReceber', 'contasPagar', 'movimentacoesCaixa']);
  const bind = (colName, targetKey, extra) => {
    const unsub = onSnapshot(userCol(uid, colName), snap => {
      state[targetKey] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.loadingCollections.delete(targetKey);
      if (extra) extra();
      renderPage();
    }, err => console.error(colName, err));
    state.unsubscribers.push(unsub);
  };
  bind('ingredientes', 'ingredientes');
  bind('produtos', 'produtos');
  bind('receitas', 'receitas');
  bind('producoes', 'producoes');
  bind('vendas', 'vendas');
  bind('contas_receber', 'contasReceber');
  bind('contas_pagar', 'contasPagar');
  bind('movimentacoes_caixa', 'movimentacoesCaixa');
  bind('despesas', 'despesas');
  bind('retiradas', 'retiradas');
  bind('listas', 'listas');

  const cfgUnsub = onSnapshot(doc(db, 'users', uid, 'meta', 'config'), snap => {
    if (snap.exists()) state.config = { ...state.config, ...snap.data() };
    renderShell(); renderPage();
  });
  state.unsubscribers.push(cfgUnsub);

  const route = (location.hash.replace('#/', '') || 'resumo');
  state.route = NAV_ITEMS.find(n => n.id === route) ? route : 'resumo';
  renderShell();
  renderPage();
}
function stopListeners() {
  state.unsubscribers.forEach(u => u());
  state.unsubscribers = [];
}
window.addEventListener('hashchange', () => {
  if (!state.user) return;
  const route = location.hash.replace('#/', '') || 'resumo';
  if (NAV_ITEMS.find(n => n.id === route)) { state.route = route; renderShell(); renderPage(); }
});

function renderPage() {
  if (!state.user) return;
  const c = document.getElementById('page-content');
  const renderers = {
    resumo: renderResumo, vendas: renderVendas, producao: renderProducao,
    receitas: renderReceitas, estoque: renderEstoque, areceber: renderAReceber,
    apagar: renderAPagar, caixa: renderCaixa, saidas: renderSaidas,
    retiradas: renderRetiradas, listas: renderListas, config: renderConfig,
  };
  const fn = renderers[state.route] || renderResumo;
  c.innerHTML = fn();
  wirePage(state.route);
}

function renderResumo() {
  const dashboardCarregando = state.loadingCollections && state.loadingCollections.size > 0;
  if (dashboardCarregando) {
    return `
    <div class="page-head">
      <div><h2>Resumo</h2><div class="sub">Visão geral do seu negócio</div></div>
    </div>
    <div class="grid-cards">

      ${statCardSkeleton('A receber', ico('dollar', 17))}
      ${statCardSkeleton('A pagar', ico('fileText', 17))}
      ${statCardSkeleton('Produtos prontos', ico('box', 17))}
      ${statCardSkeleton('Estoque baixo', ico('alertTriangle', 17))}
    </div>`;
  }
  const resumo = calcularResumoDashboard({
    movimentacoes: state.movimentacoesCaixa,
    vendas: state.vendas,
    contasReceber: state.contasReceber,
    contasPagar: state.contasPagar,
    produtos: [
      ...state.ingredientes.map(i => ({ ...i, tipo: 'insumo' })),
      ...state.produtos.map(p => ({ ...p, tipo: 'produto' })),
    ],
  });
  const ultimasVendas = [...state.vendas].sort((a, b) => (b.data || '').localeCompare(a.data || '')).slice(0, 5);
  const ultimasMov = [...state.movimentacoesCaixa].sort((a, b) => (b.data || '').localeCompare(a.data || '')).slice(0, 5);

  // tendência: vendas deste mês vs. mês anterior
  const hoje = new Date();
  const mesAtualStr = hoje.toISOString().slice(0, 7);
  const mesAnterior = new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1);
  const mesAnteriorStr = mesAnterior.toISOString().slice(0, 7);
  const totalMesAnterior = round2(state.vendas.filter(v => (v.data || '').slice(0, 7) === mesAnteriorStr).reduce((a, v) => a + (v.total || 0), 0));
  let tendenciaHTML = '';
  if (totalMesAnterior > 0) {
    const variacao = Math.round(((resumo.vendasDoMes - totalMesAnterior) / totalMesAnterior) * 100);
    const up = variacao >= 0;
    tendenciaHTML = `<span style="color:${up ? 'var(--green-600)' : 'var(--red-600)'};font-weight:700;">${up ? '↑' : '↓'} ${Math.abs(variacao)}%</span> vs. mês anterior`;

    tendenciaHTML = `primeiras vendas do mês`;

          <span style="flex:1;font-size:13.5px;${p.done ? 'color:var(--muted);text-decoration:line-through;' : 'font-weight:600;'}">${p.label}</span>
          ${!p.done ? '<span style="font-size:12px;color:var(--brown-700);font-weight:700;">Ir →</span>' : ''}
        </div>`).join('')}
      </div>

      ${statCard('Vendas do mês', fmtMoeda(resumo.vendasDoMes), ico('cart'), 'brown', { navRoute: 'vendas', foot: tendenciaHTML })}
      ${statCard('A receber', fmtMoeda(resumo.aReceberPendente), ico('dollar'), 'amber', { navRoute: 'areceber' })}
      ${statCard('A pagar', fmtMoeda(resumo.aPagarPendente), ico('fileText'), 'red', { navRoute: 'apagar', alert: resumo.aPagarPendente > 0 })}
      ${statCard('Produtos prontos', resumo.qtdProdutosProntos.toLocaleString('pt-BR'), ico('box'), 'brown', { navRoute: 'estoque' })}
      ${statCard('Estoque baixo', resumo.estoqueBaixo.length, ico('alertTriangle'), resumo.estoqueBaixo.length ? 'red' : 'green', { navRoute: 'estoque', alert: resumo.estoqueBaixo.length > 0 })}

    <div class="section-2col">
      <div class="card">

        ${ultimasVendas.length ? `<table class="dtable"><tbody>
          ${ultimasVendas.map(v => `<tr><td>${esc(v.cliente || 'Cliente avulso')}<div style="font-size:11px;color:var(--muted)">${fmtData(v.data)}</div></td>
          <td class="num">${fmtMoeda(v.total)}</td>
          <td>${v.status === 'pago' ? '<span class="badge badge-green">Pago</span>' : '<span class="badge badge-amber">Pendente</span>'}</td></tr>`).join('')}
        </tbody></table>` : emptyState(ico('cart', 34), 'Nenhuma venda registrada ainda.')}

  const html = `

      <button class="btn btn-ghost" id="btn-cancel-repor">Cancelar</button>
      <button class="btn btn-primary" id="btn-save-repor">Confirmar reposição</button>
    </div>`;
  openModal('Repor estoque', html, {
    onMount: (body) => {
      body.querySelector('#f-forma-repor').onchange = (e) => {
        body.querySelector('#wrap-venc-repor').style.display = e.target.value === 'prazo' ? 'block' : 'none';
      };
      body.querySelector('#btn-cancel-repor').onclick = closeModal;
      body.querySelector('#btn-save-repor').onclick = async () => {
        const btn = body.querySelector('#btn-save-repor');
        const input = {
          quantidadeAdicionada: parseFloat(body.querySelector('#f-qtd-repor').value),
          custoUnitario: parseFloat(body.querySelector('#f-custo-repor').value),
          formaPagamento: body.querySelector('#f-forma-repor').value,
          vencimento: body.querySelector('#f-venc-repor').value,
        };
        if (!input.quantidadeAdicionada || input.quantidadeAdicionada <= 0) { toast('Quantidade deve ser maior que zero.', 'error'); return; }
        setBtnLoading(btn, true);
        try {
          await executarReposicao(item, input);
          toast('Estoque reposto com sucesso.', 'success');
          closeModal();
        } catch (e) { toast('Erro: ' + e.message, 'error'); setBtnLoading(btn, false); }
      };
    },
  });
}

async function executarReposicao(item, input) {
  const colName = item.tipo === 'produto' ? 'produtos' : 'ingredientes';
  const uid = state.user.uid;
  await runTransaction(db, async (tx) => {
    const itemRef = doc(db, 'users', uid, colName, item.id);
    const itemSnap = await tx.get(itemRef);
    if (!itemSnap.exists()) throw new Error('Item não encontrado.');
    const itemAtual = itemSnap.data();
    const { itemAtualizado, movimentacaoCaixa, contaPagar } = aplicarReposicaoEstoque({ item: { ...itemAtual, id: item.id }, input });
    tx.update(itemRef, { quantidade: itemAtualizado.novaQuantidade, custoUnitario: itemAtualizado.novoCustoUnitario });
    if (movimentacaoCaixa) tx.set(doc(db, 'users', uid, 'movimentacoes_caixa', movimentacaoCaixa.id), movimentacaoCaixa);
    if (contaPagar) tx.set(doc(db, 'users', uid, 'contas_pagar', contaPagar.id), contaPagar);
  });
}

async function excluirItemEstoque(item) {
  const ok = await confirmDialog({ title: 'Excluir item', message: `Excluir "${item.nome}" do estoque? Esta ação não pode ser desfeita.`, confirmLabel: 'Excluir', danger: true });
  if (!ok) return;
  const colName = item.tipo === 'produto' ? 'produtos' : 'ingredientes';
  try {
    await deleteDoc(doc(db, 'users', state.user.uid, colName, item.id));
    toast('Item excluído.', 'success');
  } catch (e) { toast('Erro ao excluir: ' + e.message, 'error'); }
}

function abrirModalReceita(receita) {
  if (state.ingredientes.length === 0) {
    toast('Cadastre ao menos um insumo no Estoque antes de criar uma receita.', 'error');
    return;
  }
  openModal(receita ? 'Editar receita' : 'Nova receita', receitaFormHTML(receita), {
    size: 'lg',
    onMount: (body) => {
      // preselect existing values (selects created via template string lose "selected" for dynamic option lists built before insertion in some cases, so set programmatically)
      if (receita) {
        body.querySelectorAll('[data-row]').forEach((row, idx) => {
          const ing = receita.ingredientes[idx];
          if (ing) row.querySelector('.rf-ing-id').value = ing.ingredienteId;
        });
      }
      const updatePreview = () => {
        const ingredientes = coletarIngredientesForm(body);
        const receitaTmp = { ingredientes, rendimento: parseFloat(body.querySelector('#rf-rendimento').value) || 1 };
        const custo = calcularCustoReceita(receitaTmp, ingredientesMap());
        body.querySelector('#rf-custo-preview').innerHTML = `Total: <b>${fmtMoeda(custo.custoTotal)}</b> &nbsp;•&nbsp; Por unidade: <b style="color:var(--brown-700)">${fmtMoeda(custo.custoPorUnidade)}</b>`;
      };
      const wireRow = (row) => {
        row.querySelectorAll('select, input').forEach(el => el.addEventListener('input', updatePreview));
        row.querySelector('[data-remove-row]').onclick = () => { row.remove(); updatePreview(); };
      };
      body.querySelectorAll('[data-row]').forEach(wireRow);
      body.querySelector('#rf-add-ingrediente').onclick = () => {
        const opcoesIngredientes = state.ingredientes.map(i => `<option value="${i.id}">${esc(i.nome)}</option>`).join('');
        const div = document.createElement('div');
        div.innerHTML = ingredienteRowHTML({}, opcoesIngredientes);
        const row = div.firstElementChild;
        body.querySelector('#rf-ingredientes').appendChild(row);
        wireRow(row);
      };
      body.querySelector('#rf-rendimento').addEventListener('input', updatePreview);
      updatePreview();

      body.querySelector('#btn-cancel-receita').onclick = closeModal;
      body.querySelector('#btn-save-receita').onclick = async () => {
        const btn = body.querySelector('#btn-save-receita');
        const nome = body.querySelector('#rf-nome').value.trim();
        const rendimento = parseFloat(body.querySelector('#rf-rendimento').value);
        const ingredientes = coletarIngredientesForm(body);
        if (!nome) { toast('Informe o nome da receita.', 'error'); return; }
        if (!rendimento || rendimento <= 0) { toast('Rendimento deve ser maior que zero.', 'error'); return; }
        if (ingredientes.length === 0) { toast('Adicione ao menos um ingrediente.', 'error'); return; }
        if (ingredientes.some(i => !i.ingredienteId || !i.quantidade || i.quantidade <= 0)) { toast('Preencha todos os ingredientes com quantidade maior que zero.', 'error'); return; }
        const payload = {
          nome, rendimento, ingredientes,
          categoria: body.querySelector('#rf-categoria').value.trim(),
          produtoId: body.querySelector('#rf-produto').value || null,
        };

        try {
          const id = receita?.id || genId();
          await setDoc(doc(db, 'users', state.user.uid, 'receitas', id), payload, { merge: true });
          toast('Receita salva.', 'success');
          closeModal();
        } catch (e) { toast('Erro ao salvar: ' + e.message, 'error'); setBtnLoading(btn, false); }

      body.querySelector('#btn-save-producao').onclick = async () => {

        const receita = state.receitas.find(r => r.id === receitaId);

        if (!quantidade || quantidade <= 0) { toast('Informe uma quantidade válida.', 'error'); return; }

          toast('Produção registrada com sucesso.', 'success');
          closeModal();
        } catch (e) { toast(e.message, 'error'); setBtnLoading(btn, false); }
      };
    },
  });
}

async function executarProducao(receita, quantidade) {
  const uid = state.user.uid;
  await runTransaction(db, async (tx) => {
    const ingRefs = receita.ingredientes.map(i => doc(db, 'users', uid, 'ingredientes', i.ingredienteId));
    const ingSnaps = await Promise.all(ingRefs.map(r => tx.get(r)));
    const ingMap = {};
    ingSnaps.forEach((snap, idx) => {
      if (!snap.exists()) throw new Error('Um dos ingredientes da receita não existe mais no estoque.');
      ingMap[receita.ingredientes[idx].ingredienteId] = { id: snap.id, ...snap.data() };
    });
    let produtoRef = null, produtoAtual = { quantidade: 0 };
    if (receita.produtoId) {
      produtoRef = doc(db, 'users', uid, 'produtos', receita.produtoId);
      const pSnap = await tx.get(produtoRef);
      if (pSnap.exists()) produtoAtual = pSnap.data();
    }
    const result = aplicarProducao({ receita, quantidadeProduzir: quantidade, ingredientesMap: ingMap, produtoAtual });
    result.ingredientesAtualizados.forEach(u => {
      tx.update(doc(db, 'users', uid, 'ingredientes', u.ingredienteId), { quantidade: u.novaQuantidade });
    });
    if (produtoRef) {
      tx.update(produtoRef, { quantidade: result.produtoAtualizado.novaQuantidade, custoUnitario: result.produtoAtualizado.custoUnitario });
    }
    tx.set(doc(db, 'users', uid, 'producoes', result.producaoDoc.id), result.producaoDoc);
  });
}

async function executarVenda(vendaInput) {
  const uid = state.user.uid;
  await runTransaction(db, async (tx) => {
    const produtoIds = [...new Set(vendaInput.itens.map(i => i.produtoId))];
    const refs = produtoIds.map(id => doc(db, 'users', uid, 'produtos', id));
    const snaps = await Promise.all(refs.map(r => tx.get(r)));
    const pMap = {};
    snaps.forEach((s, idx) => { if (s.exists()) pMap[produtoIds[idx]] = { id: s.id, ...s.data() }; });
    const result = aplicarVenda({ vendaInput, produtosMap: pMap });
    result.produtosAtualizados.forEach(u => tx.update(doc(db, 'users', uid, 'produtos', u.produtoId), { quantidade: u.novaQuantidade }));
    tx.set(doc(db, 'users', uid, 'vendas', result.vendaDoc.id), result.vendaDoc);
    if (result.movimentacaoCaixa) tx.set(doc(db, 'users', uid, 'movimentacoes_caixa', result.movimentacaoCaixa.id), result.movimentacaoCaixa);
    if (result.contaReceber) tx.set(doc(db, 'users', uid, 'contas_receber', result.contaReceber.id), result.contaReceber);
  });
}

async function marcarComoPago(conta) {
  try {
    await runTransaction(db, async (tx) => {
      const ref = doc(db, 'users', state.user.uid, 'contas_pagar', conta.id);
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error('Conta não encontrada.');
      const atual = snap.data();
      const result = aplicarMarcarPago(atual);
      if (result.noop) return;
      tx.update(ref, { status: result.novoStatus });
      tx.set(doc(db, 'users', state.user.uid, 'movimentacoes_caixa', result.movimentacaoCaixa.id), result.movimentacaoCaixa);
    });
    toast('Marcado como pago.', 'success');
  } catch (e) { toast('Erro: ' + e.message, 'error'); }
}

async function adicionarItemLista(listaId, texto) {
  if (!texto || !texto.trim()) return;
  const lista = state.listas.find(l => l.id === listaId);
  if (!lista) return;
  const novosItens = [...(lista.itens || []), { id: genId(), texto: texto.trim(), concluido: false }];
  try { await updateDoc(doc(db, 'users', state.user.uid, 'listas', listaId), { itens: novosItens }); }
  catch (e) { toast('Erro: ' + e.message, 'error'); }
}
async function alternarItemLista(listaId, itemId) {
  const lista = state.listas.find(l => l.id === listaId);
  if (!lista) return;
  const novosItens = (lista.itens || []).map(i => i.id === itemId ? { ...i, concluido: !i.concluido } : i);
  try { await updateDoc(doc(db, 'users', state.user.uid, 'listas', listaId), { itens: novosItens }); }
  catch (e) { toast('Erro: ' + e.message, 'error'); }
}
async function removerItemLista(listaId, itemId) {
  const lista = state.listas.find(l => l.id === listaId);
  if (!lista) return;
  const novosItens = (lista.itens || []).filter(i => i.id !== itemId);
  try { await updateDoc(doc(db, 'users', state.user.uid, 'listas', listaId), { itens: novosItens }); }
  catch (e) { toast('Erro: ' + e.message, 'error'); }
}
async function excluirLista(listaId) {
  const ok = await confirmDialog({ title: 'Excluir lista', message: 'Excluir esta lista e todos os seus itens?', confirmLabel: 'Excluir', danger: true });

  try { await deleteDoc(doc(db, 'users', state.user.uid, 'listas', listaId)); toast('Lista excluída.', 'success'); }

// ============================================================
// 21) WIRING DE EVENTOS POR PÁGINA (delegação simples)
// ============================================================
function wirePage(route) {
  const c = document.getElementById('page-content');

  c.querySelectorAll('[data-nav]').forEach(el => el.onclick = (e) => { e.preventDefault(); navigate(el.dataset.nav); });
  c.querySelectorAll('[data-nav-card]').forEach(el => {
    el.onclick = () => navigate(el.dataset.navCard);
    el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigate(el.dataset.navCard); } };
  });
  c.querySelectorAll('[data-onboard-step]').forEach(el => el.onclick = () => navigate(el.dataset.onboardStep));
  const emptyActions = {
    'novo-item': () => abrirModalItem(null),
    'nova-receita': () => abrirModalReceita(null),
    'nova-producao': () => abrirModalProducao(),
    'nova-venda': () => abrirModalVenda(),
  };
  c.querySelectorAll('[data-empty-action]').forEach(el => {
    const fn = emptyActions[el.dataset.emptyAction];
    if (fn) el.onclick = fn;
  });

  if (route === 'estoque') {
    const btnNovo = () => abrirModalItem(null);
    const bn = c.querySelector('#btn-novo-item'); if (bn) bn.onclick = btnNovo;
    const fb = c.querySelector('#fab-novo-item'); if (fb) fb.onclick = btnNovo;
    c.querySelector('#estoque-busca')?.addEventListener('input', (e) => { estoqueBusca = e.target.value; renderPage(); document.getElementById('estoque-busca').focus(); document.getElementById('estoque-busca').selectionStart = document.getElementById('estoque-busca').value.length; });
    c.querySelectorAll('.tag-btn').forEach(el => el.onclick = () => { estoqueFiltro = el.dataset.f; renderPage(); });
    c.querySelectorAll('[data-repor]').forEach(el => el.onclick = () => abrirModalReposicao(estoqueTodos().find(i => i.id === el.dataset.repor)));
    c.querySelectorAll('[data-edit-item]').forEach(el => el.onclick = () => abrirModalItem(estoqueTodos().find(i => i.id === el.dataset.editItem)));
    c.querySelectorAll('[data-del-item]').forEach(el => el.onclick = () => excluirItemEstoque(estoqueTodos().find(i => i.id === el.dataset.delItem)));
  }

  if (route === 'receitas') {
    const btnNovo = () => abrirModalReceita(null);
    const bn = c.querySelector('#btn-nova-receita'); if (bn) bn.onclick = btnNovo;
    const fb = c.querySelector('#fab-nova-receita'); if (fb) fb.onclick = btnNovo;
    c.querySelectorAll('[data-edit-receita]').forEach(el => el.onclick = () => abrirModalReceita(state.receitas.find(r => r.id === el.dataset.editReceita)));
    c.querySelectorAll('[data-del-receita]').forEach(el => el.onclick = () => excluirReceita(state.receitas.find(r => r.id === el.dataset.delReceita)));
  }

  if (route === 'producao') {
    const bn = c.querySelector('#btn-nova-producao'); if (bn) bn.onclick = abrirModalProducao;
    const fb = c.querySelector('#fab-nova-producao'); if (fb) fb.onclick = abrirModalProducao;
  }

  if (route === 'vendas') {
    const bn = c.querySelector('#btn-nova-venda'); if (bn) bn.onclick = abrirModalVenda;
    const fb = c.querySelector('#fab-nova-venda'); if (fb) fb.onclick = abrirModalVenda;
    c.querySelectorAll('[data-del-venda]').forEach(el => el.onclick = () => excluirVenda(state.vendas.find(v => v.id === el.dataset.delVenda)));
  }

  if (route === 'areceber') {
    c.querySelectorAll('[data-marcar-recebido]').forEach(el => el.onclick = () => marcarComoRecebido(state.contasReceber.find(x => x.id === el.dataset.marcarRecebido)));
  }

  if (route === 'apagar') {
    const bn = c.querySelector('#btn-nova-conta-pagar'); if (bn) bn.onclick = abrirModalContaPagar;
    const fb = c.querySelector('#fab-nova-conta-pagar'); if (fb) fb.onclick = abrirModalContaPagar;
    c.querySelectorAll('[data-marcar-pago]').forEach(el => el.onclick = () => marcarComoPago(state.contasPagar.find(x => x.id === el.dataset.marcarPago)));
  }

  if (route === 'caixa') {
    const bn = c.querySelector('#btn-lancamento-manual'); if (bn) bn.onclick = abrirModalLancamentoManual;
    const fb = c.querySelector('#fab-lancamento-manual'); if (fb) fb.onclick = abrirModalLancamentoManual;
  }

  if (route === 'saidas') {
    const bn = c.querySelector('#btn-nova-despesa'); if (bn) bn.onclick = abrirModalDespesa;
    const fb = c.querySelector('#fab-nova-despesa'); if (fb) fb.onclick = abrirModalDespesa;
  }

  if (route === 'retiradas') {
    const bn = c.querySelector('#btn-nova-retirada'); if (bn) bn.onclick = abrirModalRetirada;
    const fb = c.querySelector('#fab-nova-retirada'); if (fb) fb.onclick = abrirModalRetirada;
  }

  if (route === 'listas') {
    const bn = c.querySelector('#btn-nova-lista'); if (bn) bn.onclick = abrirModalNovaLista;
    const fb = c.querySelector('#fab-nova-lista'); if (fb) fb.onclick = abrirModalNovaLista;
    c.querySelectorAll('[data-del-lista]').forEach(el => el.onclick = () => excluirLista(el.dataset.delLista));
    c.querySelectorAll('[data-toggle-item-lista]').forEach(el => el.onclick = () => alternarItemLista(el.dataset.toggleItemLista, el.dataset.itemId));
    c.querySelectorAll('[data-del-item-lista]').forEach(el => el.onclick = () => removerItemLista(el.dataset.delItemLista, el.dataset.itemId2));
    c.querySelectorAll('[data-add-item-btn]').forEach(el => {
      const listaId = el.dataset.addItemBtn;
      const input = c.querySelector(`[data-add-item-lista="${listaId}"]`);
      const add = () => { adicionarItemLista(listaId, input.value); input.value = ''; };
      el.onclick = add;
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
    });
  }

  if (route === 'config') {
    c.querySelector('#cf-save').onclick = async () => {
      const btn = c.querySelector('#cf-save');
      setBtnLoading(btn, true);
      try {
        await setDoc(doc(db, 'users', state.user.uid, 'meta', 'config'), {
          nomeEmpresa: c.querySelector('#cf-nome').value.trim(),
          nomeProprietaria: c.querySelector('#cf-proprietaria').value.trim(),
          logoUrl: c.querySelector('#cf-logo').value.trim(),
          moeda: c.querySelector('#cf-moeda').value,
        }, { merge: true });
        toast('Configurações salvas.', 'success');
      } catch (e) { toast('Erro: ' + e.message, 'error'); }
      setBtnLoading(btn, false);
    };
    c.querySelector('#cf-logout').onclick = handleLogout;
  }
}

</script>
</body>
</html>
